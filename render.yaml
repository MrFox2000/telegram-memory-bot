services:
  - type: web
    name: telegram-memory-bot
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: RATE_LIMIT
        value: "8"
      # Fill these in the dashboard after the first deploy:
      - key: BOT_TOKEN
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
