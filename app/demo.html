<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory bot — live demo</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: #0a0c12; color: #e7eaf1;
        font: 15px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif;
        display: grid; place-items: center; padding: 24px;
      }
      .app {
        width: min(920px, 100%); background: #10141d; border: 1px solid #1d2330;
        border-radius: 16px; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto;
        height: min(760px, 88vh);
      }
      header { padding: 16px 20px; border-bottom: 1px solid #1d2330; display: flex; gap: 14px; align-items: center; }
      header .dot { width: 9px; height: 9px; border-radius: 50%; background: #5ee08a; box-shadow: 0 0 10px #5ee08a; }
      h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -0.2px; }
      header p { margin: 0; font-size: 12px; color: #7d8496; }
      .personas { margin-left: auto; display: flex; gap: 6px; }
      .personas button {
        background: #161c27; color: #aab2c6; border: 1px solid #232a3a; border-radius: 999px;
        padding: 6px 12px; font-size: 12px; cursor: pointer;
      }
      .personas button.on { background: #1d2a52; border-color: #3b56b0; color: #cfd9ff; }
      main { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
      .msg { max-width: 78%; padding: 11px 14px; border-radius: 14px; white-space: pre-wrap; }
      .me { align-self: flex-end; background: #2a3a86; color: #eef1ff; border-bottom-right-radius: 4px; }
      .bot { align-self: flex-start; background: #171d29; border: 1px solid #222a3a; border-bottom-left-radius: 4px; }
      .meta { font-size: 11px; color: #6f778c; margin-top: 6px; }
      footer { border-top: 1px solid #1d2330; padding: 14px 20px; display: flex; gap: 10px; }
      input {
        flex: 1; background: #0c1017; border: 1px solid #232a3a; color: #e7eaf1;
        border-radius: 10px; padding: 12px 14px; font-size: 14px; outline: none;
      }
      input:focus { border-color: #3b56b0; }
      button.send { background: #3b56b0; color: #fff; border: 0; border-radius: 10px; padding: 0 18px; font-weight: 600; cursor: pointer; }
      button.send:disabled { opacity: 0.5; cursor: default; }
      .hint { padding: 0 20px 14px; font-size: 11.5px; color: #6f778c; }
      code { background: #0c1017; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <span class="dot"></span>
        <div>
          <h1>Memory bot</h1>
          <p>Persistent memory · three personas · works without an LLM key</p>
        </div>
        <div class="personas" id="personas">
          <button data-p="friend" class="on">Friend</button>
          <button data-p="colleague">Colleague</button>
          <button data-p="support">Support</button>
        </div>
      </header>

      <main id="log"></main>

      <footer>
        <input id="input" placeholder="Try: my name is Ali, I work as a developer" autocomplete="off" />
        <button class="send" id="send">Send</button>
      </footer>
      <p class="hint">
        Commands: <code>/memory</code> shows what it remembers · <code>/forget</code> wipes it ·
        <code>/persona</code> switches tone
      </p>
    </div>

    <script>
      const log = document.getElementById("log");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      let persona = "friend";

      function bubble(text, who, meta) {
        const div = document.createElement("div");
        div.className = "msg " + who;
        div.textContent = text;
        if (meta) {
          const m = document.createElement("div");
          m.className = "meta";
          m.textContent = meta;
          div.appendChild(m);
        }
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
      }

      async function send() {
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        bubble(text, "me");
        sendBtn.disabled = true;
        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });
          const data = await res.json();
          if (!res.ok) {
            bubble(data.detail || "Something went wrong.", "bot");
          } else {
            const bits = [data.persona];
            bits.push(data.used_llm ? "generated" : "template");
            if (Object.keys(data.remembered || {}).length) {
              bits.push("remembered: " + Object.keys(data.remembered).join(", "));
            }
            bubble(data.reply, "bot", bits.join(" · "));
          }
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      }

      sendBtn.addEventListener("click", send);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") send();
      });

      document.getElementById("personas").addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        document.querySelectorAll(".personas button").forEach((b) => b.classList.remove("on"));
        btn.classList.add("on");
        persona = btn.dataset.p;
        // The persona lives on the server; tell it with a command.
        const label = { friend: "دوست", colleague: "همکار", support: "پشتیبان" }[persona];
        input.value = "/persona " + label;
        send();
      });

      bubble(
        "سلام 👋 من یک ربات با حافظهٔ دائمی هستم. چیزی از خودت بگو تا یادم بماند — بعد صفحه را ببند و برگرد، هنوز یادم است.",
        "bot",
        "friend · template"
      );
    </script>
  </body>
</html>
